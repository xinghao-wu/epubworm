name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check formatting
        run: make fmt-check CLANG_FORMAT=clang-format-18

  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint on Linux
        if: runner.os == 'Linux'
        run: make lint CLANG_TIDY=clang-tidy-18

      - name: Lint on macOS
        if: runner.os == 'macOS'
        run: make lint CLANG_TIDY="$(brew --prefix llvm@18)/bin/clang-tidy"

  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: g++
          - os: macos-15
            compiler: clang++
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run tests
        run: make test CXX=${{ matrix.compiler }}

      - name: Build release binary
        run: make CXX=${{ matrix.compiler }}
