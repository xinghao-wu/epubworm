name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install LLVM 22 on Linux
        if: runner.os == 'Linux'
        run: |
          curl --fail --silent --show-error \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          printf '%s\n' \
            'deb https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes clang-format-22 clang-tidy-22

      - name: Install LLVM 22 on macOS
        if: runner.os == 'macOS'
        run: brew install llvm@22

      - name: Check formatting
        if: runner.os == 'Linux'
        run: make fmt-check CLANG_FORMAT=clang-format-22

      - name: Lint on Linux
        if: runner.os == 'Linux'
        run: make lint CLANG_TIDY=clang-tidy-22

      - name: Lint on macOS
        if: runner.os == 'macOS'
        run: make lint CLANG_TIDY="$(brew --prefix llvm@22)/bin/clang-tidy"

  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: g++
          - os: macos-15
            compiler: clang++
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run tests
        run: make test CXX=${{ matrix.compiler }}

      - name: Build release binary
        run: make CXX=${{ matrix.compiler }}
