name: Homebrew

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # main

      - name: Tap repository
        run: brew tap xinghao-wu/epubworm "file://$GITHUB_WORKSPACE"

      - name: Check formula style
        run: brew style xinghao-wu/epubworm/epubworm

      - name: Audit formula
        run: brew audit --strict --online --formula xinghao-wu/epubworm/epubworm

      - name: Install formula
        run: brew install --HEAD xinghao-wu/epubworm/epubworm

      - name: Test formula
        run: brew test xinghao-wu/epubworm/epubworm
